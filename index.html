<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="timeline.css" />
  </head>
  <body>
    <main class="blank-canvas" aria-label="Launches, campaigns, and events timeline for the year">
      <div class="brand-title">Libra <span aria-hidden="true">×</span> WK LR Benelux</div>
      <nav class="timeline-actions" aria-label="Timeline controls and workspaces">
        <div class="timeline-zoom" role="group" aria-label="Timeline zoom controls">
          <button class="zoom-button" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
          <span class="zoom-level" id="zoom-level" aria-live="polite">100%</span>
          <button class="zoom-button" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
          <button class="zoom-reset" id="zoom-reset" type="button">Reset</button>
        </div>
        <details class="workspace-menu">
          <summary aria-label="Open workspace menu" title="Workspaces">
            <span class="workspace-menu-icon" aria-hidden="true"></span>
          </summary>
          <div class="workspace-menu-popover">
            <a href="/admin.html">Manage timeline</a>
            <a href="/team.html">Marketing team <span aria-hidden="true">↗</span></a>
            <button class="workspace-logout" type="button" data-auth-logout>Sign out</button>
          </div>
        </details>
      </nav>
      <p class="timeline-load-error" id="timeline-load-error" role="alert" hidden></p>
      <h1 class="timeline-title launches-title">Launches</h1>
      <h1 class="timeline-title campaigns-title">Campaigns</h1>
      <h1 class="timeline-title events-title">Events</h1>
      <div class="year-scroll" id="year-scroll" tabindex="0" aria-label="Scroll horizontally through the year">
        <div class="year-stage">
          <section class="timeline timeline-launches" aria-label="Product launches">
            <div class="timeline-line" aria-hidden="true"></div>
            <div class="launch-items" id="launch-items" aria-live="polite"></div>
            <div class="month-labels" aria-label="Months, January 2026 through March 2027"><span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span><span>Jan ’27</span><span>Feb</span><span>Mar</span></div>
          </section>
          <section class="timeline timeline-campaigns" aria-label="Campaign timeline">
            <div class="campaign-zones" id="campaign-zones" aria-label="Campaign themes by season"></div>
            <svg class="campaign-flow" viewBox="0 0 250 1000" preserveAspectRatio="none" aria-hidden="true"><path class="flow-middle" d="M 0 620 C 40 620 55 620 145 620" /><path class="flow-branding" d="M 0 620 C 40 620 55 620 72 620 C 112 620 105 520 145 520" /><path class="flow-always-on" d="M 0 620 C 40 620 55 620 72 620 C 112 620 105 720 145 720" /></svg>
            <div class="campaign-lane branding-lane" aria-label="Branding campaign lane">
              <span class="campaign-lane-label">Branding</span>
              <div class="timeline-line" aria-hidden="true"></div>
              <div class="campaign-runway" id="branding-campaigns"></div>
            </div>
            <div class="campaign-lane selling-lane" aria-label="Selling campaign lane">
              <span class="campaign-lane-label">Selling</span>
              <div class="timeline-line" aria-hidden="true"></div>
              <div class="campaign-runway" id="selling-campaigns"></div>
            </div>
            <div class="campaign-lane always-on-lane" aria-label="Always On campaign lane">
              <span class="campaign-lane-label">Always On</span>
              <div class="timeline-line" aria-hidden="true"></div>
              <div class="campaign-runway" id="always-on-campaign"></div>
            </div>
            <div class="month-labels" aria-label="Months, January 2026 through March 2027"><span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span><span>Jan ’27</span><span>Feb</span><span>Mar</span></div>
          </section>
          <section class="timeline timeline-events" aria-label="Events timeline">
            <div class="timeline-line" aria-hidden="true"></div>
            <div class="event-runway" id="event-markers" aria-label="Events"></div>
            <div class="month-labels" aria-label="Months, January 2026 through March 2027"><span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span><span>Jan ’27</span><span>Feb</span><span>Mar</span></div>
          </section>
        </div>
      </div>
      <div class="timeline-scroll-control" aria-label="Timeline scroll control">
        <input id="timeline-scrollbar" type="range" min="0" max="0" value="0" step="1" aria-label="Scroll timeline horizontally" />
      </div>
    </main>
    <dialog class="detail-dialog" id="timeline-detail-dialog" aria-labelledby="detail-title" aria-describedby="detail-description">
      <div class="detail-dialog-inner">
        <button class="detail-dialog-close" type="button" aria-label="Close details">×</button>
        <p class="detail-dialog-type" id="detail-type"></p>
        <h2 id="detail-title"></h2>
        <p class="detail-dialog-date" id="detail-date"></p>
        <p class="detail-dialog-description" id="detail-description"></p>
        <section class="detail-activities" id="detail-activities" aria-label="Related marketing activities" hidden>
          <h3>Related marketing activities</h3>
          <ul id="detail-activities-list"></ul>
        </section>
      </div>
    </dialog>
    <script src="auth.js"></script>
    <script src="timeline.js"></script>
  </body>
</html>
